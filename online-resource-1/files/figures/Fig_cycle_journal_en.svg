<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="500" viewBox="0 0 1140 500" role="img" aria-labelledby="title desc"><title id="title">Audit remediation and verification workflow</title><desc id="desc">Seven stages from audit to packaging. Issues found during checking return to semantic mapping and remediation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#46525e"/></marker></defs><rect width="1140" height="500" fill="white"/><rect x="20" y="20" width="260" height="175" rx="8" fill="#ffffff" stroke="#46525e" stroke-width="2"/><text x="35" y="57" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">1 Audit</text><text x="35" y="97" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Publication structure</text><text x="35" y="126" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Exported GLB models</text><text x="35" y="155" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Colour and naming</text><rect x="300" y="20" width="260" height="175" rx="8" fill="#ffffff" stroke="#46525e" stroke-width="2"/><text x="315" y="57" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">2 Map semantics</text><text x="315" y="97" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Component roles</text><text x="315" y="126" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Human-reviewed labels</text><text x="315" y="155" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Descriptions</text><rect x="580" y="20" width="260" height="175" rx="8" fill="#ffffff" stroke="#46525e" stroke-width="2"/><text x="595" y="57" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">3 Build pages</text><text x="595" y="97" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Keyboard controls</text><text x="595" y="126" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Text alternatives</text><text x="595" y="155" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Static views</text><rect x="860" y="20" width="260" height="175" rx="8" fill="#ffffff" stroke="#46525e" stroke-width="2"/><text x="875" y="57" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">4 Recheck</text><text x="875" y="97" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Publication validation</text><text x="875" y="126" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Colour calculations</text><text x="875" y="155" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Technical task runs</text><rect x="860" y="280" width="260" height="175" rx="8" fill="#e2f0ee" stroke="#46525e" stroke-width="2"/><text x="875" y="317" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">5 Author checks</text><text x="875" y="357" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Keyboard operation</text><text x="875" y="386" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Recorded NVDA check</text><text x="875" y="415" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Record the test scope</text><rect x="580" y="280" width="260" height="175" rx="8" fill="#ffffff" stroke="#46525e" stroke-width="2"/><text x="595" y="317" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">6 Review chemistry</text><text x="595" y="357" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Orbital descriptions</text><text x="595" y="386" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Symmetry and bonding</text><text x="595" y="415" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Schematic geometry</text><rect x="300" y="280" width="260" height="175" rx="8" fill="#ffffff" stroke="#46525e" stroke-width="2"/><text x="315" y="317" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15202b">7 Package</text><text x="315" y="357" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Versioned artefacts</text><text x="315" y="386" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Source and data</text><text x="315" y="415" font-family="Arial, sans-serif" font-size="21" fill="#15202b">Known limitations</text><g fill="none" stroke="#46525e" stroke-width="3" marker-end="url(#arrow)"><path d="M280 107H295"/><path d="M560 107H575"/><path d="M840 107H855"/><path d="M990 195V275"/><path d="M860 367H845"/><path d="M580 367H565"/><path d="M430 455V480H150V235H430V200" stroke-dasharray="8 7"/></g><text x="24" y="225" font-family="Arial, sans-serif" font-size="21" fill="#46525e">Revise and recheck</text></svg>