  <pattern id="pat-p" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FBEDE4"/><circle cx="5" cy="5" r="1.3" fill="#D55E00" opacity="0.7"/></pattern>
  <pattern id="pat-h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#E3F4EE"/><rect width="3" height="10" fill="#009E73" opacity="0.55"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#46525E"/></marker>
