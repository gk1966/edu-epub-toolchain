<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="title-sp2 desc-sp2" lang="en">
<title id="title-sp2">sp² hybridization of carbon</title>
<desc id="desc-sp2">Energy diagram of the valence orbitals of carbon in three columns. Ground state: 2s with two electrons of opposite spin; 2p with two unpaired electrons in two orbitals and one empty orbital. Excited state: one electron moves from 2s to the empty 2p, giving 2s¹ 2p³ with four unpaired electrons. sp² hybridization: 2s and 2 of the 2p orbitals combine into 3 equivalent sp² hybrid orbitals, each with one electron, at an energy between 2s and 2p. 1 unhybridized 2p orbital remains, each with one electron, and form π bonds. Energies are qualitative, not to scale. 2s, 2p and hybrid orbitals differ in colour, fill pattern and label.</desc>
<defs>
